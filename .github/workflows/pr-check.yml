# Reusable workflow grouping the checks run against a pull request.
name: PR Check

on:
  workflow_call:

# clear all permissions for GITHUB_TOKEN
permissions: {}

jobs:
  # Number of the pull request being checked: taken from the event for pull_request(_target),
  # looked up from the head commit for workflow_run (whose pull_requests is empty for forks).
  pr-number:
    permissions:
      pull-requests: read
    runs-on: ubuntu-slim
    outputs:
      number: ${{ github.event.pull_request.number || steps.pr.outputs.number }}
    steps:
      - name: Find the pull request
        id: pr
        if: github.event_name == 'workflow_run'
        uses: apache/maven-gh-actions-shared/.github/actions/pr-number@v5
        with:
          head-sha: ${{ github.event.workflow_run.head_sha }}
          state: open

  # The PR description must contain at least one CHECKED Apache license declaration
  # ("- [x] I hereby declare ...").
  # - Missing       -> adds ONE comment and fails.
  # - Fixed         -> hides the comment as outdated and passes.
  # - Removed again -> unhides the same comment (no duplicates).
  license-declaration:
    needs: pr-number
    permissions:
      pull-requests: write
      issues: write # PR comments are "issue comments" in the API
      statuses: write # commit status on the PR head for workflow_run
    runs-on: ubuntu-slim
    # Skip when no open pull request matches the commit of a workflow_run (a newer push triggers its own run).
    # A skipped job counts as successful, so a required check doesn't block the merge.
    if: needs.pr-number.outputs.number != ''
    # Prevents races (e.g. opened + edited in quick succession => two comments).
    # Do NOT define the same concurrency group in the caller – it would deadlock.
    concurrency:
      group: license-declaration-check-${{ github.repository }}-${{ needs.pr-number.outputs.number }}
      cancel-in-progress: false
    steps:
      - name: Check license declaration
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ needs.pr-number.outputs.number }}
        with:
          script: |
            const MARKER = '<!-- license-declaration-check -->';

            // At least one of these lines must be present with a checked box
            const DECLARATIONS = [
              'I hereby declare this contribution to be licensed under the [Apache License Version 2.0, January 2004](https://www.apache.org/licenses/LICENSE-2.0)',
              'I hereby declare that I have filed an [Apache Individual Contributor License Agreement](https://www.apache.org/licenses/icla.pdf).',
            ];

            const { owner, repo } = context.repo;

            const prNumber = Number(process.env.PR_NUMBER);
            if (!prNumber) {
              core.setFailed(`This workflow must be called from pull_request, pull_request_target or workflow_run events (got "${context.eventName}").`);
              return;
            }

            // "- [x] <declaration>" or "* [X] <declaration>", one per line, optional indentation/trailing spaces.
            // Links may use either http:// or https://.
            const escape = s => s
              .replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
              .replace(/https?:\/\//g, 'https?://');
            const regex = new RegExp(
              `^[ \\t]*[-*][ \\t]+\\[[xX]\\][ \\t]+(?:${DECLARATIONS.map(escape).join('|')})[ \\t]*\\r?$`,
              'm'
            );

            // Read the pull request from the API: the workflow_run payload doesn't contain it,
            // and the pull_request payload may be stale on "Re-run jobs"
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
            core.info(`Author: ${pr.user.login}, type: ${pr.user.type}, author_association: ${pr.author_association}`);

            // workflow_run runs on the default branch, so its own check is not shown on the PR.
            // Report the result as a commit status on the PR head instead.
            const setStatus = async (state, description) => {
              if (context.eventName !== 'workflow_run') return;
              try {
                await github.rest.repos.createCommitStatus({
                  owner, repo, sha: pr.head.sha, state, description,
                  context: 'PR Check / license-declaration',
                  target_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
                });
              } catch (err) {
                core.warning(`Cannot set the commit status: ${err.message}`);
              }
            };
            await setStatus('pending', 'Checking the license declaration');

            // Bots (Dependabot, Renovate, other GitHub Apps) don't need the declaration
            if (pr.user.type === 'Bot') {
              core.info(`✅ ${pr.user.login} is a bot - declaration not required.`);
              await setStatus('success', 'Declaration not required from a bot');
              return;
            }

            const hasDeclaration = regex.test(pr.body || '');

            // Members/committers of the organization owning the repository (apache) don't need the declaration.
            //   MEMBER       = org member with public membership (PMC member)
            //   OWNER        = org owner
            //   COLLABORATOR = committer whose org membership is private (covers most Apache committers)
            const isMember = ['OWNER', 'MEMBER', 'COLLABORATOR'].includes(pr.author_association);

            // Note: private org members may appear as CONTRIBUTOR,
            // so we also check write access via the API instead of relying on author_association only.
            let hasWriteAccess = false;
            if (!hasDeclaration && !isMember) {
              try {
                const { data: perm } = await github.rest.repos.getCollaboratorPermissionLevel({
                  owner, repo, username: pr.user.login,
                });
                hasWriteAccess = ['admin', 'maintain', 'write'].includes(perm.permission);
                core.info(`Permission of ${pr.user.login}: ${perm.permission}`);
              } catch (err) {
                // Fall back to requiring the declaration - a committer's PR may then fail the check
                core.warning(`Cannot read the permission of ${pr.user.login}: ${err.message}`);
              }
            }

            // Find our comment: author must be a bot and the comment must contain the marker.
            // Iterate page by page and stop as soon as it is found - it is usually one of the first comments.
            let existing;
            for await (const { data: page } of github.paginate.iterator(github.rest.issues.listComments, {
              owner, repo, issue_number: prNumber, per_page: 100,
            })) {
              existing = page.find(c => c.user?.type === 'Bot' && c.body?.includes(MARKER));
              if (existing) break;
            }

            // Check whether the comment is already hidden
            let isMinimized = false;
            if (existing) {
              try {
                const res = await github.graphql(
                  `query($id: ID!) {
                     node(id: $id) { ... on IssueComment { isMinimized } }
                   }`,
                  { id: existing.node_id }
                );
                isMinimized = res.node?.isMinimized ?? false;
              } catch (err) {
                // The comment may have been deleted in the meantime - continue without hiding/unhiding it
                core.warning(`Cannot read the state of the existing comment: ${err.message}`);
              }
            }

            // ---------- Declaration OK ----------
            if (hasDeclaration || isMember || hasWriteAccess) {
              if (existing && !isMinimized) {
                try {
                  await github.graphql(
                    `mutation($id: ID!) {
                       minimizeComment(input: { subjectId: $id, classifier: OUTDATED }) {
                         minimizedComment { isMinimized }
                       }
                     }`,
                    { id: existing.node_id }
                  );
                  core.info('Comment marked as outdated (hidden).');
                } catch (err) {
                  // The comment may have been deleted in the meantime - not a reason to fail the check
                  core.warning(`Cannot hide the existing comment: ${err.message}`);
                }
              }
              core.info(hasDeclaration ? '✅ PR description contains a checked license declaration.'
                : isMember ? `✅ ${pr.user.login} is ${pr.author_association} - declaration not required.`
                : `✅ ${pr.user.login} has write access to the repository - declaration not required.`);
              await setStatus('success', hasDeclaration ? 'License declaration checked' : 'Declaration not required from a committer');
              return;
            }

            // ---------- Declaration missing ----------
            if (!existing) {
              // The comment is added only once
              await github.rest.issues.createComment({
                owner, repo, issue_number: prNumber,
                body: [
                  MARKER,
                  '### ⚠️ License declaration missing',
                  '',
                  'The pull request description must contain at least one of the following lines with a **checked** box (`[x]`):',
                  '',
                  '```markdown',
                  ...DECLARATIONS.map(d => `- [ ] ${d}`),
                  '```',
                  '',
                  'This comment will be hidden automatically once the description is fixed.',
                ].join('\n'),
              });
              core.info('Comment added.');
            } else if (isMinimized) {
              // The declaration was removed again – unhide the existing comment instead of adding a new one
              try {
                await github.graphql(
                  `mutation($id: ID!) {
                     unminimizeComment(input: { subjectId: $id }) {
                       unminimizedComment { isMinimized }
                     }
                   }`,
                  { id: existing.node_id }
                );
                core.info('Existing comment restored (unhidden).');
              } catch (err) {
                core.warning(`Cannot restore the existing comment: ${err.message}`);
              }
            }

            await setStatus('failure', 'License declaration missing');
            core.setFailed('❌ PR description does not contain a checked license declaration.');
