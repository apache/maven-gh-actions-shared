name: Labels sync

permissions:
  contents: read

on:
  # Monthly, report-only: reading labels from a public repository needs no
  # permissions, so this runs on the default GITHUB_TOKEN, changes nothing, and
  # fails if anything has drifted from labels.js.
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:
    inputs:
      token:
        type: string
        description: 'Access token (classic) with repo scope. Leave empty to only report drift without changing anything.'
        required: false
      create-missing:
        type: boolean
        description: 'Also create labels that a repository does not have yet. Off by default: a plain run only corrects the colour and description of labels that already exist.'
        required: false
        default: false

jobs:
  repos:
    name: Prepare repositories list
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.repo.outputs.matrix }}

    steps:
      - id: repo
        run: |
          {
            echo 'matrix<<EOF'          
            curl -s https://gitbox.apache.org/repositories.json | jq '.projects.maven.repositories | to_entries | sort_by(.key) | .[] | select(.value.description | contains("archived") | not) | .key' | jq -sc
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          
          cat "$GITHUB_OUTPUT"

  label-sync:
    runs-on: ubuntu-latest
    needs: repos
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        repo: ${{ fromJSON( needs.repos.outputs.matrix ) }}

    steps:
      - name: Mask GitHub token
        run: echo "::add-mask::$(jq -r '.inputs.token' $GITHUB_EVENT_PATH)"

      - name: Checkout
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          persist-credentials: false

      - name: Labels synchronizetion in ${{ matrix.repo }}
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          OWNER: 'apache'
          REPO: ${{ matrix.repo }}
          CREATE_MISSING: ${{ inputs.create-missing }}
          APPLY: ${{ inputs.token != '' }}
        with:
          github-token: ${{ inputs.token || github.token }}
          script: |
            const labels = require('./.github/labels.js');
            const createMissing = process.env.CREATE_MISSING === 'true';
            const apply = process.env.APPLY === 'true';
            const drift = [];

            console.log('Labels to update:');
            console.log(labels);
            
            const currentLabels = await github.rest.issues.listLabelsForRepo({
                owner: process.env.OWNER,
                repo: process.env.REPO
              });
            
            console.log('Current project labels:');
            console.log(currentLabels.data);
          
            for (const label of labels) {
              const currentLabel = currentLabels.data.find(({name}) => name == label.name);

              console.log('Label:');
              console.log(label);

              console.log('currentLabel:');
              console.log(currentLabel);
            
              if (!currentLabel) {

                drift.push('missing: ' + label.name);
                if (apply && createMissing) {
                  console.log('Add label: ' + label.name);
                  await github.rest.issues.createLabel({
                    owner: process.env.OWNER,
                    repo: process.env.REPO,
                    ...label
                  });
                } else {
                  console.log('Label: ' + label.name + ' is absent - not creating it, re-run with create-missing to add it');
                }

              } else if (label.color != currentLabel.color || label.description != currentLabel.description) {
                
                drift.push('differs: ' + label.name);
                if (apply) {
                  console.log('Update label: ' + label.name);
                  await github.rest.issues.updateLabel({
                    owner: process.env.OWNER,
                    repo: process.env.REPO,
                    ...label
                  });
                }
            
              } else {
                console.log('Label: ' + label.name + ' is up to date');
              }
            }

            if (drift.length && !apply) {
              core.summary.addHeading(process.env.REPO, 3).addList(drift).write();
              core.setFailed(process.env.REPO + ': ' + drift.length + ' label(s) drifted from labels.js');
            }
