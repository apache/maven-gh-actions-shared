name: "PR number"
description: "Find the pull request whose current head or merge commit is the given commit"

inputs:
  head-sha:
    description: "Commit the pull request head or merge commit must point to"
    required: true
  state:
    description: "Pull request state to search: open, closed, merged or all"
    required: true
  repository:
    description: "Repository to search"
    default: ${{ github.repository }}
  token:
    description: "Token used for the GitHub API"
    default: ${{ github.token }}

outputs:
  number:
    description: "Pull request number, empty when no pull request matches"
    value: ${{ steps.pr.outputs.number }}

runs:
  using: "composite"
  steps:
    - name: Find the pull request
      id: pr
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ inputs.repository }}
        HEAD_SHA: ${{ inputs.head-sha }}
        STATE: ${{ inputs.state }}
      run: |
        [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::bad head sha"; exit 1; }
        [[ "$STATE" =~ ^(open|closed|merged|all)$ ]] || { echo "::error::bad state"; exit 1; }
        PR=$(gh pr list -R "$REPO" --state "$STATE" --search "$HEAD_SHA" \
               --json number,headRefOid,mergeCommit \
               --jq ".[] | select(.headRefOid == \"$HEAD_SHA\" or .mergeCommit.oid == \"$HEAD_SHA\") | .number" | head -n1)
        echo "PR number: ${PR:-<none>} for commit: $HEAD_SHA"
        if [[ -n "$PR" ]]; then
          echo "Pull request: [#$PR]($GITHUB_SERVER_URL/$REPO/pull/$PR) for commit: \`$HEAD_SHA\`" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "Pull request: none for commit: \`$HEAD_SHA\`" >> "$GITHUB_STEP_SUMMARY"
        fi
        echo "number=$PR" >> "$GITHUB_OUTPUT"
