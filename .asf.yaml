# see https://s.apache.org/asfyaml
github:
  description: "Apache Maven Shared GH Actions"
  homepage: https://maven.apache.org/
  labels:
    - java
    - build-management
    - apache-maven
    - maven
    - hacktoberfest
  enabled_merge_buttons:
    squash: true
    merge: false
    rebase: true
  rulesets:
    - name: "Branch Protection"
      type: branch
      branches:
        includes:
          - "~DEFAULT_BRANCH"
          - "v5"
    - name: "Read-only Branches"
      target: branch
      enforcement: active
      conditions:
        ref_name:
          include:
            - "refs/heads/v1"
            - "refs/heads/v2"
            - "refs/heads/v3"
            - "refs/heads/v4"
          exclude: []
      rules:
        - type: deletion
        - type: update
  pull_requests:
    del_branch_on_merge: true
  features:
    issues: true

notifications:
  commits: commits@maven.apache.org
  issues: issues@maven.apache.org
  pullrequests: issues@maven.apache.org
